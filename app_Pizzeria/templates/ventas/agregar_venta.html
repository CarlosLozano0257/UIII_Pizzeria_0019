{% extends 'base.html' %}

{% block title %}➕ Registrar Venta{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-success text-white">
                    <h2 class="h5 mb-0">➕ Registrar Nueva Venta</h2>
                </div>
                <div class="card-body p-4">
                    
                    <form action="{% url 'agregar_venta' %}" method="POST">
                        {% csrf_token %}
                        
                        <!-- Fila 1: Producto y Empleado -->
                        <div class="row mb-3">
                            <div class="col-md-7">
                                <label for="producto" class="form-label">Producto del Menú (*)</label>
                                <select class="form-select" id="producto" name="producto" required>
                                    <option value="" disabled selected>Selecciona un producto...</option>
                                    {% for prod in productos %}
                                    <option value="{{ prod.id }}">{{ prod.nombre }} (${{ prod.precio }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label for="empleado" class="form-label">Empleado (*)</label>
                                <select class="form-select" id="empleado" name="empleado" required>
                                    <option value="" disabled selected>Selecciona un empleado...</option>
                                    {% for emp in empleados %}
                                    <option value="{{ emp.id }}">{{ emp.nombre_completo }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <!-- Fila 2: Cantidad, Total y Método de Pago -->
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label for="cantidad" class="form-label">Cantidad (*)</label>
                                <input type="number" class="form-control" id="cantidad" name="cantidad" value="1" required>
                            </div>
                            <div class="col-md-4">
                                <label for="monto_total" class="form-label">Monto Total ($) (*)</label>
                                <input type="number" step="0.01" class="form-control" id="monto_total" name="monto_total" placeholder="150.00" required>
                            </div>
                            <div class="col-md-5">
                                <label for="metodo_pago" class="form-label">Método de Pago (*)</label>
                                <select class="form-select" id="metodo_pago" name="metodo_pago">
                                    <option value="Efectivo" selected>Efectivo</option>
                                    <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                                    <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                                    <option value="Transferencia">Transferencia</option>
                                </select>
                            </div>
                        </div>

                        <!-- Fila 3: Promoción (Opcional) -->
                        <div class="mb-3">
                            <label for="promocion" class="form-label">Promoción (Opcional)</label>
                            <select class="form-select" id="promocion" name="promocion">
                                <option value="">(Ninguna promoción aplicada)</option>
                                {% for promo in promociones %}
                                <option value="{{ promo.id }}">{{ promo.nombre_promo }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <hr>

                        <!-- Botones -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{% url 'ver_ventas' %}" class="btn btn-secondary me-md-2">
                                ❌ Cancelar
                            </a>
                            <button type="submit" class="btn btn-success">
                                💾 Registrar Venta
                            </button>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
